<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#174a7e">
  <title>算数 文章題｜テーマをえらぶ版</title>
  <style>
    :root{--navy:#174a7e;--blue:#2f7db9;--sky:#eaf6ff;--line:#b9d8ee;--yellow:#ffd65c;--ink:#12304d;--muted:#61768a;--white:#fff;--green:#1c9b68;--red:#d94c4c}
    *{box-sizing:border-box} body{margin:0;font-family:"UD デジタル 教科書体 N-R","BIZ UDPGothic","Yu Gothic",sans-serif;background:#eef8ff;color:var(--ink);font-weight:700;min-height:100vh;-webkit-user-select:none;user-select:none}
    button,input{font:inherit} button{cursor:pointer} .hidden{display:none!important}
    header{height:82px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:14px 24px;gap:15px;box-shadow:0 3px 0 #0d355e}
    .logo{width:50px;height:50px;border-radius:15px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:30px}
    header h1{font-size:28px;margin:0} header small{font-size:16px;opacity:.85;font-weight:600}
    .header-actions{margin-left:auto;display:flex;align-items:center;gap:10px}.top-btn{border:2px solid #fff;background:#fff;color:var(--navy);border-radius:14px;padding:12px 18px;font-size:17px}.user-pill{background:#376895;border-radius:99px;padding:11px 16px;font-size:17px}
    main{max-width:1380px;margin:auto;padding:24px}.panel{background:#fff;border:2px solid var(--line);border-radius:24px;padding:25px;box-shadow:0 8px 25px #194d7220}
    .screen-title{text-align:center;margin:0 0 8px;font-size:30px}.lead{text-align:center;color:var(--muted);margin:0 0 22px;font-size:17px;font-weight:600}
    .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.theme-card{background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 12px;min-height:210px;color:var(--ink);transition:.15s;box-shadow:0 5px 0 #c6deed}.theme-card:hover,.theme-card:focus-visible{transform:translateY(-3px);border-color:var(--blue)}.theme-card.selected{border-color:var(--navy);background:#eaf4ff;box-shadow:0 5px 0 var(--navy)}
    .theme-icon{font-size:74px;line-height:1.2;display:block}.theme-card strong{display:block;font-size:23px;margin-top:8px}.theme-card span:last-child{font-size:14px;color:var(--muted);display:block;margin-top:6px}
    .stepbar{display:flex;justify-content:center;gap:10px;margin-bottom:22px}.step{background:#dce8f1;color:#61768a;border-radius:99px;padding:9px 24px}.step.active{background:var(--navy);color:#fff}
    .choice-layout{display:grid;grid-template-columns:minmax(270px,.75fr) minmax(520px,1.6fr);gap:22px}.theme-summary{background:#f0f8ff;border-radius:20px;padding:20px;text-align:center}.theme-summary .big{font-size:80px}.theme-summary h2{font-size:27px;margin:8px}.theme-summary p{font-weight:600;color:var(--muted);line-height:1.6}
    .setting-area{display:grid;gap:18px}.setting-box{border:2px solid #d6e7f3;border-radius:18px;padding:18px}.setting-box h3{font-size:20px;margin:0 0 12px}.setting-box .hint{font-size:14px;color:var(--muted);font-weight:600;margin:-5px 0 12px}
    .name-entry{display:flex;gap:10px}.name-entry input{min-width:0;flex:1;border:3px solid #bcd4e6;border-radius:13px;padding:13px 15px;font-size:19px;user-select:text;-webkit-user-select:text}.add-btn{background:var(--blue);color:#fff;border:0;border-radius:13px;padding:0 20px}
    .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.chip{border:2px solid #aacce5;background:#f2f9ff;color:var(--ink);border-radius:99px;padding:9px 14px;font-size:17px}.chip::after{content:' ×';color:#aa3a3a}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.option{border:3px solid #c4d9e9;background:#fff;border-radius:15px;padding:12px 8px;color:var(--ink);font-size:17px;min-height:58px}.option.selected{background:#e4f2ff;border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
    .minor-settings{display:grid;grid-template-columns:1fr 1fr;gap:16px}.seg{display:flex;gap:8px}.seg button{flex:1;border:2px solid #bed4e5;background:#fff;border-radius:12px;padding:11px}.seg button.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
    .footer-actions{display:flex;gap:14px;margin-top:22px}.back{border:3px solid var(--blue);background:#fff;color:var(--navy);border-radius:16px;padding:15px 25px}.primary{flex:1;border:0;background:var(--yellow);color:#4a3900;border-radius:16px;padding:16px 25px;font-size:22px;box-shadow:0 5px 0 #d7ad32}.primary:disabled{opacity:.45;cursor:not-allowed}
    body.quiz-mode{overflow:hidden}.quiz-mode main{height:calc(100dvh - 82px);padding:14px 20px}.quiz-mode #quizScreen{height:100%;display:flex;flex-direction:column;min-height:0}
    .quiz-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex:none}.badge{background:var(--navy);color:#fff;border-radius:99px;padding:8px 16px;font-size:17px}.class-code{background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:11px;padding:5px 14px;font-size:19px;font-weight:800}.progress{margin-left:auto;background:#fff4c8;border-radius:99px;padding:9px 17px;font-size:19px}
    .quiz-layout{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}.question-frame,.scratch-panel,.answer-tools,.formula-panel{border:2px solid var(--line);border-radius:18px;background:#fff}.question-frame{padding:10px 14px;flex:none}.question{font-size:27px;line-height:1.5;background:#edf7ff;border-left:8px solid var(--blue);border-radius:11px;padding:13px 18px;min-height:88px;display:flex;align-items:center;white-space:pre-line}
    .picked-line{font-size:14px;color:var(--muted);margin:0}.work-area{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(390px,.65fr);gap:12px;flex:1;min-height:0}.scratch-panel{padding:7px;min-height:0;display:flex;flex-direction:column;gap:6px}.scratch-toolbar{display:grid;gap:5px;flex:none}.tool-row{display:flex;align-items:center;gap:5px;min-width:0;overflow-x:auto;scrollbar-width:thin}.tool-btn,.icon-btn{flex:none;border:2px solid #b8cfdf;background:#fff;color:var(--navy);border-radius:9px;padding:5px 8px;font-size:13px;min-height:33px}.tool-btn.active,.icon-btn.active{border-color:var(--navy);background:#dceeff;box-shadow:inset 0 0 0 1px var(--navy)}.icon-btn{font-size:20px;min-width:42px;padding:3px 7px}.tool-divider{width:1px;height:25px;background:#c9dce9;flex:none}.counter{margin-left:auto;background:#eef7ff;border-radius:9px;padding:5px 9px;font-size:14px;white-space:nowrap}.scratch{flex:1;height:auto;min-height:0;border-radius:14px;background-color:#fbfdff;background-image:linear-gradient(#dbeaf5 1px,transparent 1px),linear-gradient(90deg,#dbeaf5 1px,transparent 1px);background-size:28px 28px;border:2px solid #d0e3f1;position:relative;touch-action:none;overflow:hidden;-webkit-touch-callout:none}.scratch canvas,.block-layer,.container-layer{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.container-layer{pointer-events:none;z-index:1;display:flex;gap:10px;align-items:stretch;padding:52px 14px 14px}.container-card{flex:1;border:3px dashed #9abbd2;border-radius:18px;background:#eaf6ff70;position:relative;min-width:0}.container-card::before{content:attr(data-label);position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid #bad2e3;border-radius:8px;padding:3px 7px;font-size:12px;color:#526c81}.container-card.remainder{border-color:#e1a73a;background:#fff6d970}.scratch canvas{z-index:2}.block-layer{z-index:3;pointer-events:none}.scratch.block-tool .block-layer,.scratch.delete-tool .block-layer{pointer-events:auto}.scratch.block-tool canvas,.scratch.delete-tool canvas{pointer-events:none}.scratch-label{position:absolute;top:10px;left:12px;color:#7d91a3;font-size:14px;font-weight:600;pointer-events:none;z-index:4}.math-block{position:absolute;display:grid;place-items:center;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px #22446635);cursor:grab;touch-action:none;-webkit-touch-callout:none}.math-block.crossed{filter:grayscale(1) opacity(.52)}.math-block.crossed::after{content:'×';position:absolute;color:#d62222;font-size:1.45em;font-weight:900;text-shadow:0 1px #fff}.math-block.dragging{cursor:grabbing;z-index:10}.scratch-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;color:#7a91a4;background:#ffffffdc;border-radius:12px;padding:8px 12px;font-size:14px;z-index:1;text-align:center}
    .right-work{display:grid;grid-template-rows:auto minmax(105px,1fr);gap:10px;min-height:0}.answer-tools{display:grid;grid-template-columns:minmax(180px,.92fr) minmax(205px,1.08fr);gap:10px;padding:11px}.answer-panel{min-width:0}.answer-panel h2{font-size:20px;margin:0 0 7px}.answer-row{display:flex;align-items:center;gap:7px;background:#f2f7fb;padding:7px;border-radius:12px}.answer-input{width:100%;min-width:0;border:4px solid #f0c44d;border-radius:11px;background:#fff;text-align:center;font-size:34px;padding:5px;user-select:text;-webkit-user-select:text}.unit{font-size:20px;min-width:36px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}.keypad button{border:2px solid #b9cfe0;border-radius:10px;background:#fff;color:var(--navy);font-size:22px;padding:7px}.keypad .zero{grid-column:1/3}.check{width:100%;border:0;background:var(--blue);color:#fff;border-radius:11px;padding:9px;margin-top:7px;font-size:17px}.skip{width:100%;border:2px solid #d89d24;background:#fff;color:#855b00;border-radius:11px;padding:7px;margin-top:6px;font-size:15px}.feedback{min-height:39px;border-radius:10px;margin-top:6px;padding:7px;font-size:16px;display:flex;align-items:center}.feedback.ok{background:#daf5e7;color:#087247}.feedback.ng{background:#ffe4e4;color:#a62d2d}.next{width:100%;border:0;background:var(--yellow);border-radius:11px;padding:9px;font-size:17px;color:#4a3900}
    .formula-panel{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;padding:10px;min-height:0;align-items:start}.formula-btn{border:0;background:#7653bd;color:#fff;border-radius:12px;padding:10px;font-size:17px;min-height:52px;align-self:start}.formula-content{display:grid;gap:5px;min-width:0}.formula-row{display:grid;grid-template-columns:95px 1fr;align-items:center;border-radius:9px;background:#f1ebff;padding:6px 10px;font-size:16px;min-width:0}.formula-row:last-child{background:#e1f4e9}.formula-row span{color:#6945b0}.formula-row:last-child span{color:#087247}.formula-row strong{overflow-wrap:anywhere}.result{text-align:center;padding:38px}.result .result-icon{font-size:86px}.result h2{font-size:34px;margin:12px}.score{font-size:30px;color:var(--navy)}
    .user-list{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:20px auto;max-width:900px}.user-choice{border:3px solid #bcd5e8;background:#fff;color:var(--navy);border-radius:18px;padding:16px 24px;font-size:21px}.user-new{display:flex;gap:10px;max-width:650px;margin:25px auto}.user-new input{flex:1;min-width:0;border:3px solid #bcd4e6;border-radius:14px;padding:14px 16px;font-size:20px;user-select:text;-webkit-user-select:text}.record-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.record-card{background:#eef7ff;border:2px solid #c9e0f1;border-radius:18px;padding:20px;text-align:center}.record-card strong{display:block;font-size:32px;color:var(--navy)}.record-table{width:100%;border-collapse:collapse;margin-top:18px;font-weight:600}.record-table th{background:var(--navy);color:#fff;padding:12px}.record-table td{padding:12px;border-bottom:1px solid #d9e7f1;text-align:center}.danger{border:3px solid #d94c4c;background:#fff;color:#b62f2f;border-radius:15px;padding:13px 20px;font-size:17px}
    @media(max-width:900px) and (orientation:portrait){header small{display:none}.theme-grid{grid-template-columns:repeat(2,1fr)}.choice-layout{grid-template-columns:1fr;gap:14px}.theme-summary{display:flex;align-items:center;text-align:left;gap:18px}.theme-summary .big{font-size:55px}.question{font-size:23px;min-height:auto}.work-area{grid-template-columns:1fr}.scratch{min-height:300px}body.quiz-mode{overflow:auto}.quiz-mode main,.quiz-mode #quizScreen{height:auto}.formula-panel{min-height:130px}}
    @media(max-height:750px) and (orientation:landscape){header{height:64px;padding:8px 16px}.logo{width:44px;height:44px;font-size:27px}header h1{font-size:24px}header small{font-size:14px}.top-btn,.user-pill{padding:8px 12px;font-size:15px}.quiz-mode main{height:calc(100dvh - 64px);padding:8px 14px}.quiz-head{margin-bottom:5px}.badge{padding:5px 11px;font-size:14px}.class-code{padding:2px 9px;font-size:16px}.progress{padding:6px 12px;font-size:16px}.quiz-layout{gap:6px}.question-frame{padding:6px 9px}.question{font-size:22px;line-height:1.35;min-height:62px;padding:7px 12px}.work-area{gap:7px}.scratch-panel{padding:6px}.tool-btn,.icon-btn{min-height:29px;padding:3px 7px;font-size:12px}.icon-btn{font-size:18px}.counter{padding:4px 7px;font-size:12px}.right-work{gap:6px;grid-template-rows:auto minmax(82px,1fr)}.answer-tools{padding:7px;gap:7px}.answer-panel h2{font-size:17px;margin-bottom:4px}.answer-row{padding:4px}.answer-input{font-size:28px;padding:2px}.keypad{gap:4px}.keypad button{font-size:19px;padding:4px}.check{padding:6px;margin-top:4px;font-size:15px}.skip{padding:4px;margin-top:4px;font-size:13px}.feedback{min-height:29px;margin-top:4px;padding:4px;font-size:13px}.next{padding:6px;font-size:15px}.formula-panel{padding:6px;gap:6px;grid-template-columns:145px minmax(0,1fr)}.formula-btn{min-height:39px;padding:6px;font-size:14px}.formula-row{padding:3px 7px;font-size:13px}.container-layer{padding-top:44px}}
    @media(max-width:560px){header{height:auto;padding:10px 12px}.logo{width:42px;height:42px}.header-actions{display:none}header h1{font-size:21px}main{padding:12px}.panel{padding:16px;border-radius:18px}.theme-card{min-height:160px}.theme-icon{font-size:52px}.theme-card strong{font-size:18px}.minor-settings{grid-template-columns:1fr}.screen-title{font-size:25px}.question{font-size:21px;padding:14px}.answer-tools{grid-template-columns:1fr}.formula-panel{grid-template-columns:1fr}}
    .container-layer{display:grid}.container-card{flex:auto}.container-symbol{position:absolute;right:6px;bottom:3px;font-size:28px;opacity:.16}#iconPalette{display:flex;gap:4px}
  </style>
</head>
<body>
  <header>
    <div class="logo">文</div><div><h1>算数　文章題</h1><small>すきなテーマを えらんで とこう</small></div>
    <div class="header-actions"><span class="user-pill hidden" id="userPill"></span><button class="top-btn hidden" id="recordBtn">きろく</button><button class="top-btn hidden" id="changeBtn">えらびなおす</button><button class="top-btn hidden" id="switchUserBtn">人をかえる</button></div>
  </header>
  <main>
    <section id="userScreen" class="panel">
      <h2 class="screen-title">だれが つかいますか？</h2><p class="lead">前に使った名前をえらぶか、新しい名前を入力します。</p>
      <div class="user-list" id="userList"></div>
      <div class="user-new"><input id="learnerName" maxlength="12" placeholder="名前を入力"><button id="addLearner" class="primary">この名前ではじめる</button></div>
    </section>

    <section id="themeScreen" class="panel hidden">
      <div class="stepbar"><div class="step active">1 テーマ</div><div class="step">2 でてくるもの</div><div class="step">3 もんだい</div></div>
      <h2 class="screen-title">どのテーマにしますか？</h2><p class="lead">すきな世界を1つえらびます。</p>
      <div class="theme-grid" id="themeGrid"></div>
      <div class="footer-actions"><button id="toChoice" class="primary" disabled>つぎへ　→</button></div>
    </section>

    <section id="choiceScreen" class="panel hidden">
      <div class="stepbar"><div class="step">1 テーマ</div><div class="step active">2 でてくるもの</div><div class="step">3 もんだい</div></div>
      <h2 class="screen-title">問題に出すものを えらぼう</h2><p class="lead">複数えらべます。えらんだものだけが問題に出ます。</p>
      <div class="choice-layout"><div id="themeSummary" class="theme-summary"></div><div class="setting-area" id="settingArea"></div></div>
      <div class="footer-actions"><button id="backTheme" class="back">← テーマ</button><button id="startBtn" class="primary">この設定ではじめる</button></div>
    </section>

    <section id="quizScreen" class="hidden">
      <div class="quiz-head"><span class="badge" id="quizTheme"></span><span class="class-code" id="classCode"></span><span class="picked-line" id="quizPicked"></span><span class="progress" id="progress"></span></div>
      <div class="quiz-layout">
        <div class="question-frame"><div class="question" id="question"></div></div>
        <div class="work-area">
          <div class="scratch-panel">
            <div class="scratch-toolbar" aria-label="お絵かきとブロックの道具">
              <div class="tool-row"><button class="tool-btn active" id="penOnlyMode">✏️ ペンだけ</button><button class="tool-btn" id="blockMode">✏️＋🔘 ペンとブロック</button><span class="tool-divider"></span><button class="tool-btn active" id="penTool">ペン</button><button class="tool-btn hidden" id="placeTool">ブロック</button><button class="tool-btn hidden" id="deleteTool">1こ消す</button><button class="tool-btn hidden" id="frameToggle">🧺 わくを表示</button><span class="counter" id="blockCounter">かず 0</span></div>
              <div class="tool-row hidden" id="blockControls"><span id="iconPalette"></span><span class="tool-divider"></span><button class="tool-btn" id="add5">＋5</button><button class="tool-btn" id="add10">＋10</button><button class="tool-btn active" id="gridToggle">マスにそろえる</button><button class="tool-btn active" id="countToggle">かずを表示</button><button class="tool-btn" id="speakCount">🔊 よむ</button><button class="tool-btn" id="sizeToggle">大きさ：中</button><button class="tool-btn" id="undoBtn">↶ もどす</button><button class="tool-btn" id="clearDraw">ぜんぶけす</button></div>
            </div>
            <div class="scratch pen-tool" id="scratch"><span class="scratch-label">✏️ かいて かんがえよう</span><div class="container-layer" id="containerLayer"></div><canvas id="drawCanvas"></canvas><div class="block-layer" id="blockLayer"></div><div class="scratch-hint hidden" id="scratchHint"></div></div>
          </div>
          <div class="right-work">
            <div class="answer-tools">
              <div class="answer-panel"><h2>こたえ</h2><div class="answer-row"><input id="answer" class="answer-input" inputmode="numeric" pattern="[0-9]*" readonly><span id="unit" class="unit"></span></div><button class="check" id="checkBtn">こたえあわせ</button><button class="skip" id="skipBtn">この問題をスキップ</button><div class="feedback" id="feedback"></div><button class="next hidden" id="nextBtn">つぎのもんだい　→</button></div>
              <div class="keypad" id="keypad"></div>
            </div>
            <div class="formula-panel"><button class="formula-btn" id="formulaBtn">① しきを見る</button><div class="formula-content hidden" id="formulaContent"><div class="formula-row" id="formulaRow1"><span>① しき</span><strong id="formulaExpr"></strong></div><div class="formula-row hidden" id="formulaRow2"><span>② けいさん</span><strong id="formulaCalc"></strong></div><div class="formula-row hidden" id="formulaRow3"><span>③ こたえ</span><strong id="formulaAnswer"></strong></div></div></div>
          </div>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="panel result hidden"><div class="result-icon">🎉</div><h2>おわりました！</h2><p class="score" id="score"></p><div class="footer-actions"><button id="sameAgain" class="primary">おなじ設定でもう一度</button><button id="chooseAgain" class="back">えらびなおす</button></div></section>

    <section id="recordScreen" class="panel hidden">
      <h2 class="screen-title" id="recordTitle">学習のきろく</h2><p class="lead">この端末に保存された、この人の記録です。</p>
      <div class="record-cards" id="recordCards"></div><div id="recordDetails"></div>
      <div class="footer-actions"><button id="recordBack" class="back">← もどる</button><button id="deleteLearner" class="danger">この人のデータを消す</button></div>
    </section>
  </main>
  <script>
  (()=>{
    'use strict';
    const STORE='themeWordProblemPrototypeV1',RECORDS='themeWordProblemLearnersV1';
    const themes={
      block:{name:'ブロック冒険',icon:'⛏️💎',desc:'なかまの名前と、集める鉱石をえらびます。',names:true,groups:[{key:'items',title:'宝石・鉱石をえらぶ',values:[['💎','ダイヤ'],['🟢','エメラルド'],['🟡','金'],['⚙️','鉄'],['🔴','レッドストーン'],['🔵','ラピスラズリ'],['🪨','石炭']]}]},

      const snapshot=()=>{work.history.push({image:canvas.toDataURL(),blocks:JSON.stringify(work.blocks)});if(work.history.length>30)work.history.shift()};
      const updateCount=()=>{const n=work.blocks.filter(b=>(!work.icon||b.icon===work.icon)&&!b.crossed).length;$('blockCounter').textContent=work.showCount?`かず ${n}`:'かず ？';$('blockCounter').title=work.icon?`${work.icon} の数`:''};
      const renderBlocks=()=>{layer.innerHTML='';work.blocks.forEach(b=>{const el=document.createElement('span');el.className=`math-block${b.crossed?' crossed':''}`;el.textContent=b.icon;el.style.left=`${b.x}%`;el.style.top=`${b.y}%`;el.style.fontSize=`${b.size}px`;el.dataset.id=b.id;layer.appendChild(el);let start=null,moved=false;el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const index=work.blocks.findIndex(x=>x.id===b.id);if(index<0)return;if(work.tool==='delete'){snapshot();work.blocks.splice(index,1);renderBlocks();return}if(work.tool!=='block')return;snapshot();start={x:e.clientX,y:e.clientY};moved=false;el.classList.add('dragging');el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!start||work.tool!=='block')return;if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)moved=true;const p=snapPos(layerPos(e));b.x=p.x;b.y=p.y;el.style.left=`${p.x}%`;el.style.top=`${p.y}%`;e.preventDefault()});const finish=e=>{if(!start)return;el.classList.remove('dragging');if(!moved&&state.questions[state.index]?.op==='sub'){b.crossed=!b.crossed;renderBlocks()}else updateCount();start=null};el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish)});updateCount()};
      const addBlock=(p,icon=work.icon,size=work.size)=>{if(!icon)return;const s=snapPos(p);work.blocks.push({id:`b${Date.now()}${Math.random()}`,icon,x:s.x,y:s.y,size,crossed:false})};
      const addMany=n=>{if(!work.icon)return;snapshot();const start=work.blocks.length;for(let i=0;i<n;i++){const k=start+i,cols=10;addBlock({x:7+(k%cols)*9,y:20+(Math.floor(k/cols)%5)*16})}renderBlocks()};
      const renderPalette=()=>{$('iconPalette').innerHTML=work.icons.map((x,i)=>`<button class="icon-btn ${work.icon===x.icon?'active':''}" data-work-icon="${esc(x.icon)}" title="${esc(x.label)}">${x.icon}</button>`).join('');document.querySelectorAll('[data-work-icon]').forEach(b=>b.onclick=()=>{work.icon=b.dataset.workIcon;renderPalette();updateCount()})};
      const renderContainers=q=>{const target=$('containerLayer');if(!work.showFrames||!q||!['mul','div'].includes(q.op)){target.innerHTML='';target.style.gridTemplateColumns='';return}const count=q.groupCount||0,total=count+(q.op==='div'?1:0),cols=Math.min(total,5),symbol=q.op==='div'?'👤':q.groupLabel==='はこ'?'📦':q.groupLabel==='かご'?'🧺':q.groupLabel==='さら'?'🍽️':'🎁';target.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;target.innerHTML=Array.from({length:count},(_,i)=>`<div class="container-card" data-label="${i+1}${q.groupLabel}め"><span class="container-symbol">${symbol}</span></div>`).join('')+(q.op==='div'?'<div class="container-card remainder" data-label="あまり"><span class="container-symbol">↪</span></div>':'')};
      const updateFrameButton=()=>{const q=work.currentQuestion,available=q&&['mul','div'].includes(q.op);$('frameToggle').classList.toggle('hidden',!available);$('frameToggle').classList.toggle('active',available&&work.showFrames);$('frameToggle').textContent=work.showFrames?'🧺 わくをかくす':'🧺 わくを表示'};
      const setTool=tool=>{work.tool=tool;box.classList.remove('pen-tool','block-tool','delete-tool');box.classList.add(`${tool}-tool`);$('penTool').classList.toggle('active',tool==='pen');$('placeTool').classList.toggle('active',tool==='block');$('deleteTool').classList.toggle('active',tool==='delete');$('scratchHint').classList.toggle('hidden',tool==='pen');$('scratchHint').textContent=tool==='block'?'空いている所をタップして置く・動かす。ひき算はタップで×印':tool==='delete'?'消したいブロックをタップ':''};
      const setMode=mode=>{work.mode=mode;$('penOnlyMode').classList.toggle('active',mode==='pen');$('blockMode').classList.toggle('active',mode==='blocks');$('blockControls').classList.toggle('hidden',mode!=='blocks');$('placeTool').classList.toggle('hidden',mode!=='blocks');$('deleteTool').classList.toggle('hidden',mode!=='blocks');$('blockCounter').classList.toggle('hidden',mode!=='blocks');setTool('pen')};
      canvas.addEventListener('pointerdown',e=>{if(work.tool!=='pen')return;snapshot();drawing=true;last=canvasPos(e);canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=canvasPos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
      layer.addEventListener('pointerdown',e=>{if(e.target!==layer||work.tool!=='block')return;snapshot();addBlock(layerPos(e));renderBlocks();e.preventDefault()});box.addEventListener('contextmenu',e=>e.preventDefault());
      window.prepareWorkspace=q=>{work.currentQuestion=q;work.showFrames=false;ctx.clearRect(0,0,canvas.width,canvas.height);work.blocks=[];work.history=[];work.icons=(q.icons||[]).filter(x=>x.icon);work.icon=work.icons[0]?.icon||q.itemIcon||'🔘';renderPalette();renderContainers(q);updateFrameButton();renderBlocks();setMode(work.mode)};
      window.clearWorkspace=(remember=true)=>{if(remember)snapshot();ctx.clearRect(0,0,canvas.width,canvas.height);work.blocks=[];renderBlocks()};
      $('penOnlyMode').onclick=()=>setMode('pen');$('blockMode').onclick=()=>setMode('blocks');$('penTool').onclick=()=>setTool('pen');$('placeTool').onclick=()=>setTool('block');$('deleteTool').onclick=()=>setTool('delete');$('add5').onclick=()=>addMany(5);$('add10').onclick=()=>addMany(10);$('frameToggle').onclick=()=>{work.showFrames=!work.showFrames;renderContainers(work.currentQuestion);updateFrameButton()};
      $('gridToggle').onclick=()=>{work.snap=!work.snap;$('gridToggle').classList.toggle('active',work.snap);$('gridToggle').textContent=work.snap?'マスにそろえる':'自由に置く'};$('countToggle').onclick=()=>{work.showCount=!work.showCount;$('countToggle').classList.toggle('active',work.showCount);$('countToggle').textContent=work.showCount?'かずを表示':'かずをかくす';updateCount()};$('speakCount').onclick=()=>{const n=work.blocks.filter(b=>(!work.icon||b.icon===work.icon)&&!b.crossed).length;if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(`${n}こです`))}};$('sizeToggle').onclick=()=>{const sizes=[28,36,46],i=(sizes.indexOf(work.size)+1)%sizes.length;work.size=sizes[i];$('sizeToggle').textContent=`大きさ：${['小','中','大'][i]}`};$('undoBtn').onclick=()=>{const s=work.history.pop();if(!s)return;work.blocks=JSON.parse(s.blocks);const img=new Image();img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height)};img.src=s.image;renderBlocks()};
      window.addEventListener('resize',resize);requestAnimationFrame(resize);setMode('pen')
    }
    const clearCanvas=()=>window.clearWorkspace?.(true);
    $('toChoice').onclick=()=>{renderChoice();show('choiceScreen')};$('backTheme').onclick=()=>show('themeScreen');$('startBtn').onclick=start;$('checkBtn').onclick=check;$('skipBtn').onclick=skipQuestion;$('formulaBtn').onclick=()=>showFormula(false);$('nextBtn').onclick=next;$('changeBtn').onclick=()=>{renderChoice();show('choiceScreen')};$('clearDraw').onclick=clearCanvas;$('sameAgain').onclick=start;$('chooseAgain').onclick=()=>{renderThemes();show('themeScreen')};
    $('addLearner').onclick=()=>chooseLearner($('learnerName').value);$('learnerName').onkeydown=e=>{if(e.key==='Enter')chooseLearner($('learnerName').value)};$('switchUserBtn').onclick=()=>{renderUsers();show('userScreen')};$('recordBtn').onclick=()=>{returnScreen=activeScreen;renderRecords();show('recordScreen')};$('recordBack').onclick=()=>show(returnScreen);$('deleteLearner').onclick=()=>{const p=currentProfile();if(!p)return;if(confirm(`${p.name}さんの名前と、すべての記録を消しますか？`)){delete recordStore.profiles[currentUserKey];recordStore.lastUser='';currentUserKey='';saveRecords();renderUsers();show('userScreen')}};
    load();loadRecords();renderThemes();renderUsers();keypad();setupCanvas();show(currentUserKey?'themeScreen':'userScreen');
  })();
  </script>
</body>
</html>
