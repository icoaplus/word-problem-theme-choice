<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#174a7e">
  <title>算数 文章題｜テーマをえらぶ版</title>
  <style>
    :root{--navy:#174a7e;--blue:#2f7db9;--sky:#eaf6ff;--line:#b9d8ee;--yellow:#ffd65c;--ink:#12304d;--muted:#61768a;--white:#fff;--green:#1c9b68;--red:#d94c4c}
    *{box-sizing:border-box} body{margin:0;font-family:"UD デジタル 教科書体 N-R","BIZ UDPGothic","Yu Gothic",sans-serif;background:#eef8ff;color:var(--ink);font-weight:700;min-height:100vh;-webkit-user-select:none;user-select:none}
    button,input{font:inherit} button{cursor:pointer} .hidden{display:none!important}
    header{height:82px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:14px 24px;gap:15px;box-shadow:0 3px 0 #0d355e}
    .logo{width:50px;height:50px;border-radius:15px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:30px}
    header h1{font-size:28px;margin:0} header small{font-size:16px;opacity:.85;font-weight:600}
    .header-actions{margin-left:auto;display:flex;align-items:center;gap:10px}.top-btn{border:2px solid #fff;background:#fff;color:var(--navy);border-radius:14px;padding:12px 18px;font-size:17px}.user-pill{background:#376895;border-radius:99px;padding:11px 16px;font-size:17px}
    main{max-width:1380px;margin:auto;padding:24px}.panel{background:#fff;border:2px solid var(--line);border-radius:24px;padding:25px;box-shadow:0 8px 25px #194d7220}
    .screen-title{text-align:center;margin:0 0 8px;font-size:30px}.lead{text-align:center;color:var(--muted);margin:0 0 22px;font-size:17px;font-weight:600}
    .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.theme-card{background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 12px;min-height:210px;color:var(--ink);transition:.15s;box-shadow:0 5px 0 #c6deed}.theme-card:hover,.theme-card:focus-visible{transform:translateY(-3px);border-color:var(--blue)}.theme-card.selected{border-color:var(--navy);background:#eaf4ff;box-shadow:0 5px 0 var(--navy)}
    .theme-icon{font-size:74px;line-height:1.2;display:block}.theme-card strong{display:block;font-size:23px;margin-top:8px}.theme-card span:last-child{font-size:14px;color:var(--muted);display:block;margin-top:6px}
    .stepbar{display:flex;justify-content:center;gap:10px;margin-bottom:22px}.step{background:#dce8f1;color:#61768a;border-radius:99px;padding:9px 24px}.step.active{background:var(--navy);color:#fff}
    .choice-layout{display:grid;grid-template-columns:minmax(270px,.75fr) minmax(520px,1.6fr);gap:22px}.theme-summary{background:#f0f8ff;border-radius:20px;padding:20px;text-align:center}.theme-summary .big{font-size:80px}.theme-summary h2{font-size:27px;margin:8px}.theme-summary p{font-weight:600;color:var(--muted);line-height:1.6}
    .setting-area{display:grid;gap:18px}.setting-box{border:2px solid #d6e7f3;border-radius:18px;padding:18px}.setting-box h3{font-size:20px;margin:0 0 12px}.setting-box .hint{font-size:14px;color:var(--muted);font-weight:600;margin:-5px 0 12px}
    .name-entry{display:flex;gap:10px}.name-entry input{min-width:0;flex:1;border:3px solid #bcd4e6;border-radius:13px;padding:13px 15px;font-size:19px;user-select:text;-webkit-user-select:text}.add-btn{background:var(--blue);color:#fff;border:0;border-radius:13px;padding:0 20px}
    .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.chip{border:2px solid #aacce5;background:#f2f9ff;color:var(--ink);border-radius:99px;padding:9px 14px;font-size:17px}.chip::after{content:' ×';color:#aa3a3a}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.option{border:3px solid #c4d9e9;background:#fff;border-radius:15px;padding:12px 8px;color:var(--ink);font-size:17px;min-height:58px}.option.selected{background:#e4f2ff;border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
    .minor-settings{display:grid;grid-template-columns:1fr 1fr;gap:16px}.seg{display:flex;gap:8px}.seg button{flex:1;border:2px solid #bed4e5;background:#fff;border-radius:12px;padding:11px}.seg button.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
    .footer-actions{display:flex;gap:14px;margin-top:22px}.back{border:3px solid var(--blue);background:#fff;color:var(--navy);border-radius:16px;padding:15px 25px}.primary{flex:1;border:0;background:var(--yellow);color:#4a3900;border-radius:16px;padding:16px 25px;font-size:22px;box-shadow:0 5px 0 #d7ad32}.primary:disabled{opacity:.45;cursor:not-allowed}
    body.quiz-mode{overflow:hidden}.quiz-mode main{height:calc(100dvh - 82px);padding:14px 20px}.quiz-mode #quizScreen{height:100%;display:flex;flex-direction:column;min-height:0}
    .quiz-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex:none}.badge{background:var(--navy);color:#fff;border-radius:99px;padding:8px 16px;font-size:17px}.class-code{background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:11px;padding:5px 14px;font-size:19px;font-weight:800}.progress{margin-left:auto;background:#fff4c8;border-radius:99px;padding:9px 17px;font-size:19px}
    .quiz-layout{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}.question-frame,.scratch-panel,.answer-tools,.formula-panel{border:2px solid var(--line);border-radius:18px;background:#fff}.question-frame{padding:10px 14px;flex:none}.question{font-size:27px;line-height:1.5;background:#edf7ff;border-left:8px solid var(--blue);border-radius:11px;padding:13px 18px;min-height:88px;display:flex;align-items:center}
    .picked-line{font-size:14px;color:var(--muted);margin:0}.work-area{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(400px,.75fr);gap:12px;flex:1;min-height:0}.scratch-panel{padding:10px;min-height:0}.scratch{height:100%;min-height:0;border-radius:14px;background-color:#fbfdff;background-image:linear-gradient(#dbeaf5 1px,transparent 1px),linear-gradient(90deg,#dbeaf5 1px,transparent 1px);background-size:28px 28px;border:2px solid #d0e3f1;position:relative;touch-action:none}.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.scratch-label{position:absolute;top:10px;left:12px;color:#7d91a3;font-size:14px;font-weight:600;pointer-events:none}.clear-draw{position:absolute;right:10px;top:8px;z-index:2;border:1px solid #b7ccdc;border-radius:9px;background:#fff;padding:6px 10px;color:var(--navy);font-size:14px}
    .right-work{display:grid;grid-template-rows:auto minmax(105px,1fr);gap:10px;min-height:0}.answer-tools{display:grid;grid-template-columns:minmax(180px,.92fr) minmax(205px,1.08fr);gap:10px;padding:11px}.answer-panel{min-width:0}.answer-panel h2{font-size:20px;margin:0 0 7px}.answer-row{display:flex;align-items:center;gap:7px;background:#f2f7fb;padding:7px;border-radius:12px}.answer-input{width:100%;min-width:0;border:4px solid #f0c44d;border-radius:11px;background:#fff;text-align:center;font-size:34px;padding:5px;user-select:text;-webkit-user-select:text}.unit{font-size:20px;min-width:36px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}.keypad button{border:2px solid #b9cfe0;border-radius:10px;background:#fff;color:var(--navy);font-size:22px;padding:7px}.keypad .zero{grid-column:1/3}.check{width:100%;border:0;background:var(--blue);color:#fff;border-radius:11px;padding:9px;margin-top:7px;font-size:17px}.skip{width:100%;border:2px solid #d89d24;background:#fff;color:#855b00;border-radius:11px;padding:7px;margin-top:6px;font-size:15px}.feedback{min-height:39px;border-radius:10px;margin-top:6px;padding:7px;font-size:16px;display:flex;align-items:center}.feedback.ok{background:#daf5e7;color:#087247}.feedback.ng{background:#ffe4e4;color:#a62d2d}.next{width:100%;border:0;background:var(--yellow);border-radius:11px;padding:9px;font-size:17px;color:#4a3900}
    .formula-panel{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;padding:10px;min-height:0;align-items:start}.formula-btn{border:0;background:#7653bd;color:#fff;border-radius:12px;padding:10px;font-size:17px;min-height:52px;align-self:start}.formula-content{display:grid;gap:5px;min-width:0}.formula-row{display:grid;grid-template-columns:95px 1fr;align-items:center;border-radius:9px;background:#f1ebff;padding:6px 10px;font-size:16px;min-width:0}.formula-row:last-child{background:#e1f4e9}.formula-row span{color:#6945b0}.formula-row:last-child span{color:#087247}.formula-row strong{overflow-wrap:anywhere}.result{text-align:center;padding:38px}.result .result-icon{font-size:86px}.result h2{font-size:34px;margin:12px}.score{font-size:30px;color:var(--navy)}
    .user-list{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:20px auto;max-width:900px}.user-choice{border:3px solid #bcd5e8;background:#fff;color:var(--navy);border-radius:18px;padding:16px 24px;font-size:21px}.user-new{display:flex;gap:10px;max-width:650px;margin:25px auto}.user-new input{flex:1;min-width:0;border:3px solid #bcd4e6;border-radius:14px;padding:14px 16px;font-size:20px;user-select:text;-webkit-user-select:text}.record-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.record-card{background:#eef7ff;border:2px solid #c9e0f1;border-radius:18px;padding:20px;text-align:center}.record-card strong{display:block;font-size:32px;color:var(--navy)}.record-table{width:100%;border-collapse:collapse;margin-top:18px;font-weight:600}.record-table th{background:var(--navy);color:#fff;padding:12px}.record-table td{padding:12px;border-bottom:1px solid #d9e7f1;text-align:center}.danger{border:3px solid #d94c4c;background:#fff;color:#b62f2f;border-radius:15px;padding:13px 20px;font-size:17px}
    @media(max-width:900px){header small{display:none}.theme-grid{grid-template-columns:repeat(2,1fr)}.choice-layout{grid-template-columns:1fr;gap:14px}.theme-summary{display:flex;align-items:center;text-align:left;gap:18px}.theme-summary .big{font-size:55px}.question{font-size:23px;min-height:auto}.work-area{grid-template-columns:1fr}.scratch{min-height:240px}body.quiz-mode{overflow:auto}.quiz-mode main,.quiz-mode #quizScreen{height:auto}.formula-panel{min-height:130px}}
    @media(max-height:750px) and (orientation:landscape){header{height:64px;padding:8px 16px}.logo{width:44px;height:44px;font-size:27px}header h1{font-size:24px}header small{font-size:14px}.top-btn,.user-pill{padding:8px 12px;font-size:15px}.quiz-mode main{height:calc(100dvh - 64px);padding:8px 14px}.quiz-head{margin-bottom:6px}.badge{padding:6px 13px;font-size:15px}.class-code{padding:3px 11px;font-size:17px}.progress{padding:7px 14px;font-size:17px}.quiz-layout{gap:7px}.question-frame{padding:7px 10px}.question{font-size:24px;line-height:1.4;min-height:72px;padding:9px 14px}.work-area{gap:8px}.scratch-panel{padding:7px}.right-work{gap:7px;grid-template-rows:auto minmax(88px,1fr)}.answer-tools{padding:8px;gap:8px}.answer-panel h2{font-size:18px;margin-bottom:5px}.answer-row{padding:5px}.answer-input{font-size:30px;padding:3px}.keypad{gap:5px}.keypad button{font-size:20px;padding:5px}.check{padding:7px;margin-top:5px;font-size:16px}.skip{padding:5px;margin-top:5px;font-size:14px}.feedback{min-height:32px;margin-top:5px;padding:5px;font-size:14px}.next{padding:7px;font-size:16px}.formula-panel{padding:7px;gap:8px;grid-template-columns:155px minmax(0,1fr)}.formula-btn{min-height:44px;padding:7px;font-size:15px}.formula-row{padding:4px 8px;font-size:14px}}
    @media(max-width:560px){header{height:auto;padding:10px 12px}.logo{width:42px;height:42px}.header-actions{display:none}header h1{font-size:21px}main{padding:12px}.panel{padding:16px;border-radius:18px}.theme-card{min-height:160px}.theme-icon{font-size:52px}.theme-card strong{font-size:18px}.minor-settings{grid-template-columns:1fr}.screen-title{font-size:25px}.question{font-size:21px;padding:14px}.answer-tools{grid-template-columns:1fr}.formula-panel{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="logo">文</div><div><h1>算数　文章題</h1><small>すきなテーマを えらんで とこう</small></div>
    <div class="header-actions"><span class="user-pill hidden" id="userPill"></span><button class="top-btn hidden" id="recordBtn">きろく</button><button class="top-btn hidden" id="changeBtn">えらびなおす</button><button class="top-btn hidden" id="switchUserBtn">人をかえる</button></div>
  </header>
  <main>
    <section id="userScreen" class="panel">
      <h2 class="screen-title">だれが つかいますか？</h2><p class="lead">前に使った名前をえらぶか、新しい名前を入力します。</p>
      <div class="user-list" id="userList"></div>
      <div class="user-new"><input id="learnerName" maxlength="12" placeholder="名前を入力"><button id="addLearner" class="primary">この名前ではじめる</button></div>
    </section>

    <section id="themeScreen" class="panel hidden">
      <div class="stepbar"><div class="step active">1 テーマ</div><div class="step">2 でてくるもの</div><div class="step">3 もんだい</div></div>
      <h2 class="screen-title">どのテーマにしますか？</h2><p class="lead">すきな世界を1つえらびます。</p>
      <div class="theme-grid" id="themeGrid"></div>
      <div class="footer-actions"><button id="toChoice" class="primary" disabled>つぎへ　→</button></div>
    </section>

    <section id="choiceScreen" class="panel hidden">
      <div class="stepbar"><div class="step">1 テーマ</div><div class="step active">2 でてくるもの</div><div class="step">3 もんだい</div></div>
      <h2 class="screen-title">問題に出すものを えらぼう</h2><p class="lead">複数えらべます。えらんだものだけが問題に出ます。</p>
      <div class="choice-layout"><div id="themeSummary" class="theme-summary"></div><div class="setting-area" id="settingArea"></div></div>
      <div class="footer-actions"><button id="backTheme" class="back">← テーマ</button><button id="startBtn" class="primary">この設定ではじめる</button></div>
    </section>

    <section id="quizScreen" class="hidden">
      <div class="quiz-head"><span class="badge" id="quizTheme"></span><span class="class-code" id="classCode"></span><span class="picked-line" id="quizPicked"></span><span class="progress" id="progress"></span></div>
      <div class="quiz-layout">
        <div class="question-frame"><div class="question" id="question"></div></div>
        <div class="work-area">
          <div class="scratch-panel"><div class="scratch" id="scratch"><span class="scratch-label">✏️ かいて かんがえよう</span><button class="clear-draw" id="clearDraw">ぜんぶけす</button><canvas id="drawCanvas"></canvas></div></div>
          <div class="right-work">
            <div class="answer-tools">
              <div class="answer-panel"><h2>こたえ</h2><div class="answer-row"><input id="answer" class="answer-input" inputmode="numeric" pattern="[0-9]*" readonly><span id="unit" class="unit"></span></div><button class="check" id="checkBtn">こたえあわせ</button><button class="skip" id="skipBtn">この問題をスキップ</button><div class="feedback" id="feedback"></div><button class="next hidden" id="nextBtn">つぎのもんだい　→</button></div>
              <div class="keypad" id="keypad"></div>
            </div>
            <div class="formula-panel"><button class="formula-btn" id="formulaBtn">① しきを見る</button><div class="formula-content hidden" id="formulaContent"><div class="formula-row" id="formulaRow1"><span>① しき</span><strong id="formulaExpr"></strong></div><div class="formula-row hidden" id="formulaRow2"><span>② けいさん</span><strong id="formulaCalc"></strong></div><div class="formula-row hidden" id="formulaRow3"><span>③ こたえ</span><strong id="formulaAnswer"></strong></div></div></div>
          </div>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="panel result hidden"><div class="result-icon">🎉</div><h2>おわりました！</h2><p class="score" id="score"></p><div class="footer-actions"><button id="sameAgain" class="primary">おなじ設定でもう一度</button><button id="chooseAgain" class="back">えらびなおす</button></div></section>

    <section id="recordScreen" class="panel hidden">
      <h2 class="screen-title" id="recordTitle">学習のきろく</h2><p class="lead">この端末に保存された、この人の記録です。</p>
      <div class="record-cards" id="recordCards"></div><div id="recordDetails"></div>
      <div class="footer-actions"><button id="recordBack" class="back">← もどる</button><button id="deleteLearner" class="danger">この人のデータを消す</button></div>
    </section>
  </main>
  <script>
  (()=>{
    'use strict';
    const STORE='themeWordProblemPrototypeV1',RECORDS='themeWordProblemLearnersV1';
    const themes={
      block:{name:'ブロック冒険',icon:'⛏️💎',desc:'なかまの名前と、集める鉱石をえらびます。',names:true,groups:[{key:'items',title:'宝石・鉱石をえらぶ',values:[['💎','ダイヤ'],['🟢','エメラルド'],['🟡','金'],['⚙️','鉄'],['🔴','レッドストーン'],['🔵','ラピスラズリ'],['🪨','石炭']]}]},
      animal:{name:'動物',icon:'🐰🍎',desc:'問題に出す動物と果物をえらびます。',groups:[{key:'actors',title:'動物をえらぶ',values:[['🐰','うさぎ'],['🐵','さる'],['🐻','くま'],['🐿️','りす'],['🐼','パンダ'],['🐘','ぞう']]},{key:'items',title:'果物をえらぶ',values:[['🍎','りんご'],['🍊','みかん'],['🍇','ぶどう'],['🍓','いちご'],['🍌','バナナ'],['🍐','なし']]}]},
      idol:{name:'アイドル',icon:'🎤✨',desc:'メンバーの名前と、グッズをえらびます。',names:true,groups:[{key:'items',title:'グッズをえらぶ',values:[['📷','写真'],['✨','ペンライト'],['🎫','チケット'],['🪭','うちわ'],['📛','缶バッジ'],['👕','Tシャツ'],['💿','CD']]}]},
      food:{name:'食べ物',icon:'🍖🍳',desc:'問題に出す料理や食材をえらびます。',groups:[{key:'items',title:'食べ物をえらぶ',values:[['🥩','焼き肉'],['🌭','ソーセージ'],['🥚','たまご'],['🍞','パン'],['🍗','からあげ'],['🍙','おにぎり'],['🥟','ぎょうざ'],['🍪','クッキー']]}]}
    };
    const state={theme:'',nameMode:{block:'random',idol:'random'},names:{block:[],idol:[]},selected:{},count:5,level:'small',questions:[],index:0,correct:0,skipped:0,formulaStep:0,answered:false};
    const classCodes={add:'a1',sub:'s6',mul:'m13',div:'d19'};
    const randomNames={block:['そら','レオ','ミナ','カイ','ルナ','ハル'],idol:['あおい','りん','ゆい','れん','みなと','ひなた']};
    const $=id=>document.getElementById(id), screens=['userScreen','themeScreen','choiceScreen','quizScreen','resultScreen','recordScreen'];
    let recordStore={version:1,lastUser:'',profiles:{}},currentUserKey='',returnScreen='themeScreen',activeScreen='userScreen';
    const show=id=>{activeScreen=id;screens.forEach(s=>$(s).classList.toggle('hidden',s!==id));document.body.classList.toggle('quiz-mode',id==='quizScreen');$('changeBtn').classList.toggle('hidden',id!=='quizScreen');$('recordBtn').classList.toggle('hidden',!currentUserKey||id==='userScreen'||id==='recordScreen');$('switchUserBtn').classList.toggle('hidden',!currentUserKey||id==='userScreen');$('userPill').classList.toggle('hidden',!currentUserKey);if(currentUserKey)$('userPill').textContent=`👤 ${recordStore.profiles[currentUserKey]?.name||''}`;if(id==='quizScreen')window.scrollTo(0,0)};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pick=a=>a[Math.floor(Math.random()*a.length)], rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x?.theme&&themes[x.theme]){state.theme=x.theme;state.names=x.names&&typeof x.names==='object'&&!Array.isArray(x.names)?x.names:{block:[],idol:[]};state.names.block=Array.isArray(state.names.block)?state.names.block:[];state.names.idol=Array.isArray(state.names.idol)?state.names.idol:[];state.nameMode=x.nameMode&&typeof x.nameMode==='object'?x.nameMode:{block:state.names.block.length?'custom':'random',idol:state.names.idol.length?'custom':'random'};state.nameMode.block=state.nameMode.block==='custom'?'custom':'random';state.nameMode.idol=state.nameMode.idol==='custom'?'custom':'random';state.selected=x.selected&&typeof x.selected==='object'?x.selected:{};state.count=x.count||5;state.level=x.level||'small'}}catch(e){}}
    function save(){localStorage.setItem(STORE,JSON.stringify({theme:state.theme,nameMode:state.nameMode,names:state.names,selected:state.selected,count:state.count,level:state.level}))}
    function loadRecords(){try{const x=JSON.parse(localStorage.getItem(RECORDS));if(x?.version===1&&x.profiles)recordStore=x}catch(e){}currentUserKey=recordStore.profiles[recordStore.lastUser]?recordStore.lastUser:''}
    function saveRecords(){localStorage.setItem(RECORDS,JSON.stringify(recordStore))}
    const learnerKey=name=>'u:'+name.toLocaleLowerCase('ja-JP'),cleanLearner=value=>value.trim().replace(/\s+/g,' ').slice(0,12);
    function chooseLearner(name){name=cleanLearner(name);if(!name)return;const key=learnerKey(name);if(!recordStore.profiles[key])recordStore.profiles[key]={name,createdAt:new Date().toISOString(),attempts:[],sessions:[]};currentUserKey=key;recordStore.lastUser=key;saveRecords();$('learnerName').value='';renderThemes();show('themeScreen')}
    function renderUsers(){const profiles=Object.entries(recordStore.profiles).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ja'));$('userList').innerHTML=profiles.length?profiles.map(([key,p])=>`<button class="user-choice" data-user="${esc(key)}">👤 ${esc(p.name)}</button>`).join(''):'<p class="lead">まだ登録された名前はありません。</p>';document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>chooseLearner(recordStore.profiles[b.dataset.user].name))}
    function currentProfile(){return recordStore.profiles[currentUserKey]}
    function renderRecords(){const p=currentProfile();if(!p)return;const attempts=p.attempts||[],answered=attempts.filter(a=>!a.skipped),sessions=p.sessions||[],correct=answered.filter(a=>a.correct).length,rate=answered.length?Math.round(correct/answered.length*100):0;$('recordTitle').textContent=`${p.name}さんの 学習のきろく`;$('recordCards').innerHTML=`<div class="record-card"><span>答えた問題</span><strong>${answered.length}問</strong></div><div class="record-card"><span>正解</span><strong>${correct}問</strong></div><div class="record-card"><span>正答率</span><strong>${rate}%</strong></div>`;const counts={};answered.forEach(a=>{const key=a.theme||'その他';counts[key]||(counts[key]={total:0,correct:0});counts[key].total++;if(a.correct)counts[key].correct++});const rows=Object.entries(counts).map(([key,v])=>`<tr><td>${themes[key]?.icon||''} ${themes[key]?.name||key}</td><td>${v.total}問</td><td>${v.correct}問</td><td>${Math.round(v.correct/v.total*100)}%</td></tr>`).join('');const recent=sessions.slice(-8).reverse().map(s=>`<tr><td>${new Date(s.at).toLocaleDateString('ja-JP')}</td><td>${themes[s.theme]?.name||s.theme}</td><td>${s.count}問</td><td>${s.correct}問</td><td>${s.skipped||0}問</td></tr>`).join('');$('recordDetails').innerHTML=`<h3>テーマ別</h3><table class="record-table"><thead><tr><th>テーマ</th><th>問題数</th><th>正解</th><th>正答率</th></tr></thead><tbody>${rows||'<tr><td colspan="4">まだ記録がありません。</td></tr>'}</tbody></table><h3 style="margin-top:28px">最近の取り組み</h3><table class="record-table"><thead><tr><th>日</th><th>テーマ</th><th>問題数</th><th>正解</th><th>スキップ</th></tr></thead><tbody>${recent||'<tr><td colspan="5">まだ記録がありません。</td></tr>'}</tbody></table>`}
    function renderThemes(){ $('themeGrid').innerHTML=Object.entries(themes).map(([k,t])=>`<button class="theme-card ${state.theme===k?'selected':''}" data-theme="${k}"><span class="theme-icon">${t.icon}</span><strong>${t.name}</strong><span>${t.desc}</span></button>`).join('');$('toChoice').disabled=!state.theme; document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;renderThemes()}) }
    function valid(){const t=themes[state.theme],chosen=state.selected[state.theme]||{};if(t.names&&state.nameMode[state.theme]==='custom'&&(state.names[state.theme]||[]).length===0)return false;return t.groups.every(g=>(chosen[g.key]||[]).length>0)}
    function renderChoice(){const t=themes[state.theme],chosen=state.selected[state.theme]||(state.selected[state.theme]={});$('themeSummary').innerHTML=`<div class="big">${t.icon}</div><div><h2>${t.name}</h2><p>${t.desc}</p></div>`;let html='';if(t.names){const custom=state.nameMode[state.theme]==='custom';html+=`<div class="setting-box"><h3>${state.theme==='idol'?'メンバー':'登場人物'}の名前</h3><p class="hint">おまかせなら、名前を入力しなくても始められます。</p><div class="seg"><button data-namemode="random" class="${custom?'':'selected'}">🎲 おまかせ</button><button data-namemode="custom" class="${custom?'selected':''}">✏️ 名前を登録</button></div>${custom?`<div class="name-entry" style="margin-top:12px"><input id="nameInput" maxlength="10" placeholder="名前を入力"><button class="add-btn" id="addName">追加</button></div><div class="chips" id="nameChips"></div>`:`<p class="hint" style="margin:12px 0 0">問題ごとに、用意された名前から選ばれます。</p>`}</div>`}t.groups.forEach(g=>{const selected=chosen[g.key]||[];html+=`<div class="setting-box"><h3>${g.title}</h3><p class="hint">1つ以上えらんでください。</p><div class="options">${g.values.map(([icon,label])=>`<button class="option ${selected.includes(label)?'selected':''}" data-group="${g.key}" data-value="${label}">${icon} ${label}</button>`).join('')}</div></div>`});html+=`<div class="minor-settings"><div class="setting-box"><h3>問題数</h3><div class="seg">${[5,10].map(n=>`<button data-count="${n}" class="${state.count===n?'selected':''}">${n}問</button>`).join('')}</div></div><div class="setting-box"><h3>数の大きさ</h3><div class="seg"><button data-level="small" class="${state.level==='small'?'selected':''}">小さい数</button><button data-level="normal" class="${state.level==='normal'?'selected':''}">ふつう</button></div></div></div>`;$('settingArea').innerHTML=html;
      const drawNames=()=>{if(!$('nameChips'))return;const list=state.names[state.theme]||[];$('nameChips').innerHTML=list.map((n,i)=>`<button class="chip" data-name-index="${i}">${esc(n)}</button>`).join('');document.querySelectorAll('[data-name-index]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.nameIndex,1);drawNames();updateStart()})};drawNames();
      document.querySelectorAll('[data-namemode]').forEach(b=>b.onclick=()=>{state.nameMode[state.theme]=b.dataset.namemode;renderChoice()});
      if(t.names&&state.nameMode[state.theme]==='custom'){const add=()=>{const inp=$('nameInput'),n=inp.value.trim().replace(/\s+/g,' ').slice(0,10),list=state.names[state.theme]||(state.names[state.theme]=[]);if(n&&!list.includes(n)){list.push(n);inp.value='';drawNames();updateStart()}};$('addName').onclick=add;$('nameInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}}}
      document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const key=b.dataset.group,val=b.dataset.value,arr=chosen[key]||(chosen[key]=[]),i=arr.indexOf(val);i>=0?arr.splice(i,1):arr.push(val);b.classList.toggle('selected');updateStart()});document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{state.count=+b.dataset.count;renderChoice()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=b.dataset.level;renderChoice()});updateStart();
    }
    function updateStart(){$('startBtn').disabled=!valid()}
    function iconFor(group,label){const g=themes[state.theme].groups.find(x=>x.key===group),v=g?.values.find(x=>x[1]===label);return v?.[0]||''}
    const withIcon=(group,label)=>`${label}${iconFor(group,label)}`;
    function context(){const chosen=state.selected[state.theme]||{},item=pick(chosen.items),itemText=withIcon('items',item),actors=chosen.actors||[];if(state.theme==='block'||state.theme==='idol'){const list=state.nameMode[state.theme]==='custom'?state.names[state.theme]:randomNames[state.theme],a=pick(list),others=list.filter(n=>n!==a),units={写真:'まい',ペンライト:'本',チケット:'まい',うちわ:'まい',缶バッジ:'こ',Tシャツ:'まい',CD:'まい'};return{a,b:others.length?pick(others):a,item,itemText,unit:units[item]||'こ'}}if(state.theme==='animal'){const a=pick(actors),others=actors.filter(n=>n!==a),b=others.length?pick(others):a;return{a:withIcon('actors',a),b:withIcon('actors',b),item,itemText,unit:item==='ぶどう'?'つぶ':item==='バナナ'?'本':'こ'}}const units={焼き肉:'まい',ソーセージ:'本',たまご:'こ',パン:'こ',からあげ:'こ',おにぎり:'こ',ぎょうざ:'こ',クッキー:'まい'};return{a:'お店',b:'',item,itemText,unit:units[item]||'こ'}}
    function makeQuestion(i){const c=context(),op=['add','sub','mul','div'][i%4];let a,b,total,prompt,answer,expr;if(op==='add'){a=state.level==='small'?rand(1,8):rand(8,35);b=state.level==='small'?rand(1,10-a):rand(5,28);answer=a+b;expr=`${a}＋${b}`;prompt=state.theme==='food'?`${c.itemText}が${a}${c.unit}あります。さらに${b}${c.unit}用意しました。ぜんぶで何${c.unit}ありますか。`:`${c.a}は${c.itemText}を${a}${c.unit}、${c.b}は${b}${c.unit}持っています。合わせて何${c.unit}ですか。`}else if(op==='sub'){total=state.level==='small'?rand(5,10):rand(20,70);b=rand(1,total-1);answer=total-b;expr=`${total}－${b}`;prompt=state.theme==='food'?`${c.itemText}が${total}${c.unit}あります。${b}${c.unit}食べました。のこりは何${c.unit}ですか。`:`${c.a}は${c.itemText}を${total}${c.unit}持っていました。${b}${c.unit}使いました。のこりは何${c.unit}ですか。`}else if(op==='mul'){a=state.level==='small'?rand(2,4):rand(2,9);b=state.level==='small'?rand(2,4):rand(2,9);answer=a*b;expr=`${a}×${b}`;const box=state.theme==='block'?'はこ':state.theme==='animal'?'かご':state.theme==='idol'?'セット':'さら';prompt=`${c.itemText}が1${box}に${a}${c.unit}ずつ入っています。${b}${box}では、ぜんぶで何${c.unit}ですか。`}else{b=state.level==='small'?rand(2,4):rand(2,9);answer=state.level==='small'?rand(2,4):rand(2,9);total=b*answer;expr=`${total}÷${b}`;prompt=`${total}${c.unit}の${c.itemText}を${b}人に同じ数ずつ分けます。1人分は何${c.unit}ですか。`}return{prompt,answer,unit:c.unit,expr,op,code:classCodes[op]}}
    function start(){if(!currentProfile()){renderUsers();show('userScreen');return}save();state.questions=Array.from({length:state.count},(_,i)=>makeQuestion(i));for(let i=state.questions.length-1;i>0;i--){const j=rand(0,i);[state.questions[i],state.questions[j]]=[state.questions[j],state.questions[i]]}state.index=0;state.correct=0;state.skipped=0;renderQuiz();show('quizScreen');setTimeout(()=>window.dispatchEvent(new Event('resize')),0)}
    function renderQuiz(){const q=state.questions[state.index];$('quizTheme').textContent=`${themes[state.theme].icon} ${themes[state.theme].name}`;$('classCode').textContent=q.code;$('quizPicked').textContent=themes[state.theme].names&&state.nameMode[state.theme]==='random'?'名前はおまかせ・えらんだものだけで出題中':'えらんだものだけで出題中';$('progress').textContent=`${state.index+1}問目／${state.count}問`;$('question').textContent=q.prompt;$('unit').textContent=q.unit;$('answer').value='';$('feedback').textContent='';$('feedback').className='feedback';state.formulaStep=0;$('formulaBtn').textContent='① しきを見る';$('formulaContent').classList.add('hidden');$('formulaRow2').classList.add('hidden');$('formulaRow3').classList.add('hidden');$('nextBtn').classList.add('hidden');$('checkBtn').classList.remove('hidden');$('skipBtn').classList.remove('hidden');state.answered=false;clearCanvas()}
    function keypad(){const keys=['1','2','3','4','5','6','7','8','9','0','けす'];$('keypad').innerHTML=keys.map(k=>`<button class="${k==='0'?'zero':''}" data-key="${k}">${k}</button>`).join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(state.answered)return;const k=b.dataset.key;if(k==='けす')$('answer').value=$('answer').value.slice(0,-1);else if($('answer').value.length<4)$('answer').value+=k})}
    function showFormula(showAll=false){const q=state.questions[state.index];state.formulaStep=showAll?3:Math.min(3,state.formulaStep+1);$('formulaExpr').textContent=q.expr;$('formulaCalc').textContent=`${q.expr}＝${q.answer}`;$('formulaAnswer').textContent=`${q.answer}${q.unit}`;$('formulaContent').classList.remove('hidden');$('formulaRow2').classList.toggle('hidden',state.formulaStep<2);$('formulaRow3').classList.toggle('hidden',state.formulaStep<3);$('formulaBtn').textContent=state.formulaStep===1?'② けいさんを見る':state.formulaStep===2?'③ こたえを見る':'ぜんぶ見ました'}
    function check(){if(state.answered||$('answer').value==='')return;state.answered=true;const q=state.questions[state.index],entered=+$('answer').value,ok=entered===q.answer;if(ok){state.correct++;$('feedback').textContent='せいかい！';$('feedback').className='feedback ok'}else{$('feedback').textContent=`おしい！　こたえは ${q.answer}${q.unit}`;$('feedback').className='feedback ng'}showFormula(true);const p=currentProfile();if(p){p.attempts||(p.attempts=[]);p.attempts.push({at:new Date().toISOString(),theme:state.theme,level:state.level,op:q.op,code:q.code,prompt:q.prompt,entered,answer:q.answer,unit:q.unit,correct:ok,skipped:false});if(p.attempts.length>500)p.attempts.splice(0,p.attempts.length-500);saveRecords()}$('checkBtn').classList.add('hidden');$('skipBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('nextBtn').textContent=state.index===state.count-1?'けっかを見る　→':'つぎのもんだい　→'}
    function finishSession(){const p=currentProfile();if(p){p.sessions||(p.sessions=[]);p.sessions.push({at:new Date().toISOString(),theme:state.theme,count:state.count,correct:state.correct,skipped:state.skipped,level:state.level});if(p.sessions.length>100)p.sessions.splice(0,p.sessions.length-100);saveRecords()}$('score').textContent=`${state.count}問中　${state.correct}問 せいかい${state.skipped?`　（スキップ ${state.skipped}問）`:''}`;show('resultScreen')}
    function advance(){if(state.index<state.count-1){state.index++;renderQuiz()}else finishSession()}
    function next(){advance()}
    function skipQuestion(){if(state.answered)return;state.answered=true;state.skipped++;const q=state.questions[state.index],p=currentProfile();if(p){p.attempts||(p.attempts=[]);p.attempts.push({at:new Date().toISOString(),theme:state.theme,level:state.level,op:q.op,code:q.code,prompt:q.prompt,entered:null,answer:q.answer,unit:q.unit,correct:false,skipped:true});if(p.attempts.length>500)p.attempts.splice(0,p.attempts.length-500);saveRecords()}advance()}
    function setupCanvas(){const box=$('scratch'),canvas=$('drawCanvas'),ctx=canvas.getContext('2d');let drawing=false,last=null;const resize=()=>{const r=box.getBoundingClientRect(),old=canvas.toDataURL();canvas.width=Math.round(r.width);canvas.height=Math.round(r.height);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#15538d';ctx.lineWidth=4;if(old&&old!=='data:,'){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);img.src=old}};const pos=e=>{const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*canvas.width/r.width,y:(p.clientY-r.top)*canvas.height/r.height}};canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);window.addEventListener('resize',resize);requestAnimationFrame(resize);window.clearCanvas=()=>ctx.clearRect(0,0,canvas.width,canvas.height)}
    const clearCanvas=()=>window.clearCanvas?.();
    $('toChoice').onclick=()=>{renderChoice();show('choiceScreen')};$('backTheme').onclick=()=>show('themeScreen');$('startBtn').onclick=start;$('checkBtn').onclick=check;$('skipBtn').onclick=skipQuestion;$('formulaBtn').onclick=()=>showFormula(false);$('nextBtn').onclick=next;$('changeBtn').onclick=()=>{renderChoice();show('choiceScreen')};$('clearDraw').onclick=clearCanvas;$('sameAgain').onclick=start;$('chooseAgain').onclick=()=>{renderThemes();show('themeScreen')};
    $('addLearner').onclick=()=>chooseLearner($('learnerName').value);$('learnerName').onkeydown=e=>{if(e.key==='Enter')chooseLearner($('learnerName').value)};$('switchUserBtn').onclick=()=>{renderUsers();show('userScreen')};$('recordBtn').onclick=()=>{returnScreen=activeScreen;renderRecords();show('recordScreen')};$('recordBack').onclick=()=>show(returnScreen);$('deleteLearner').onclick=()=>{const p=currentProfile();if(!p)return;if(confirm(`${p.name}さんの名前と、すべての記録を消しますか？`)){delete recordStore.profiles[currentUserKey];recordStore.lastUser='';currentUserKey='';saveRecords();renderUsers();show('userScreen')}};
    load();loadRecords();renderThemes();renderUsers();keypad();setupCanvas();show(currentUserKey?'themeScreen':'userScreen');
  })();
  </script>
